name: flipperlib
description: >-
  Flipper Zero client for Flutter: BLE and USB transports, protobuf RPC, CLI
  and STM32WB55 DFU recovery.
version: 1.0.1
repository: https://github.com/DarkFlippers/dart-flipperlib
issue_tracker: https://github.com/DarkFlippers/dart-flipperlib/issues
topics: [flipper-zero, ble, usb, embedded]

environment:
  sdk: ^3.11.1
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  fixnum: ^1.1.1
  flutter_libserialport: ^0.6.0
  protobuf: ^6.0.0
  universal_ble: ^2.1.1
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.darkflippers.flipperlib
        pluginClass: FlipperlibPlugin
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
