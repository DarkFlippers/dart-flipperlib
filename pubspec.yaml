name: flipperlib
description: >-
  Flipper Zero client for Flutter: BLE and USB transports, protobuf RPC, CLI
  and STM32WB55 DFU recovery.
version: 1.0.1
repository: https://github.com/DarkFlippers/dart-flipperlib
issue_tracker: https://github.com/DarkFlippers/dart-flipperlib/issues
topics: [flipper-zero, ble, usb, embedded]

environment:
  # What this package is actually verified on. CI here runs on
  # `channel: stable`, so the only version it has ever been green on is
  # whatever stable is that day. Declaring 3.10 promises a window nobody has
  # tested and nobody has built in.
  sdk: ^3.13.1
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  fixnum: ^1.1.1
  flutter_libserialport: ^0.6.0
  protobuf: ^6.0.0
  # The floor is a crash, not a feature. Through 2.1.1 the Windows
  # WriteValueAsync completion handler reached GetResults() on a cancelled
  # operation and let the hresult_error escape onto a WinRT thread-pool
  # thread, where terminate -> abort took the process with it - so a link
  # that died under _sendMessage killed the host app outright. 2.2.0 wrapped
  # that handler and stopped capturing its strings by reference.
  universal_ble: ^2.3.0
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.darkflippers.flipperlib
        pluginClass: FlipperlibPlugin
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
