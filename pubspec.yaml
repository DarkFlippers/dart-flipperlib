name: flipperlib
description: >-
  Flipper Zero client for Flutter: BLE and USB transports, protobuf RPC, CLI
  and STM32WB55 DFU recovery.
version: 1.0.1
repository: https://github.com/DarkFlippers/dart-flipperlib
issue_tracker: https://github.com/DarkFlippers/dart-flipperlib/issues
topics: [flipper-zero, ble, usb, embedded]

environment:
  # What this package is actually verified on. CI here runs on
  # `channel: stable`, so the only version it has ever been green on is
  # whatever stable is that day. Declaring 3.10 promises a window nobody has
  # tested and nobody has built in.
  sdk: ^3.13.1
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  # Direct, though it arrives transitively under universal_ble anyway (via
  # `bluez`): `LinuxBlePlatform` asks the system bus whether it can produce
  # `org.bluez` before letting the plugin's backend touch it, and a package a
  # file imports by name is a dependency it declares. Pure Dart, so importing
  # it costs nothing on the four platforms that never call it.
  #
  # The floor follows `bluez`, which universal_ble 3.1.1 moved to `^0.9.0`:
  # that release asks for `dbus: ^0.8.0`, so a constraint below it cannot
  # resolve alongside the plugin. 0.8.0 is a major by version alone - it adds
  # anonymous client authentication and uses records in its code generator -
  # and leaves `DBusClient.system`, `startServiceByName` and `close` exactly
  # as `transport/ble/linux.dart` already calls them.
  dbus: ^0.8.0
  ffi: ^2.1.3
  fixnum: ^1.1.1
  flutter_libserialport: ^0.6.0
  protobuf: ^6.0.0
  # The floor is a crash, not a feature, and 3.x is here for one the host
  # app runs into by construction: through 2.x the plugin's GATT client cache
  # was process-wide, so a connect from one FlutterEngine could short-circuit
  # on a client a destroyed engine created and hand back a connection that
  # reported connected and whose service discovery came back empty. qUnleashed
  # runs two engines - `main()` and the headless `widgetMain()` - and that is
  # the path nobody runs locally. 3.0.0 keeps the cache per engine.
  #
  # The floor is 3.2.0 rather than 3.0.0 for three more, all of them Windows:
  # 3.1.1 compiles the plugin with `/utf-8`, without which a clean build fails
  # on a machine whose ANSI code page is 936/932/949/950; 3.1.2 stops a failed
  # connect - the device dropping the link mid-discovery, which is what a
  # Flipper rebooting does - from freezing the app window; and 3.2.0 itself
  # opens with "Fix Windows compilation", which is why the floor is not 3.1.2.
  #
  # What 3.0.0 broke and where it is absorbed: the two callback signatures in
  # `transport/ble/ops.dart`, the `QueueType` default in
  # `transport/ble/ble.dart`, and lower-case device ids in
  # [canonicalBleDeviceId] (`transport/ble/device_id.dart`).
  universal_ble: ^3.2.0
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.darkflippers.flipperlib
        pluginClass: FlipperlibPlugin
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
