name: CI

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

# A pull request only needs its most recent push checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # flutter analyze treats info-level issues as fatal by default, so the
      # lints above fail the job without any extra flag.
      - name: Analyze
        run: flutter analyze
